<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Newsletter Sambagasse</title>
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap">
<style>
/* Visual do sambagasse.ch: noite vinho, Bangers amarelo-sol, botão pílula amarelo. Uma coluna centralizada. */
:root {
  --bg: #221010;
  --glass: rgba(255, 255, 255, .04);
  --glass-line: rgba(255, 255, 255, .12);
  --white: #ffffff;
  --text: rgba(255, 255, 255, .86);
  --muted: rgba(255, 255, 255, .58);
  --sun: #facc15;
  --red: #c20a0a;
  --error: #ff8a80;
  --font-heading: "Bangers", "Impact", "Arial Black", sans-serif;
  --font-body: "Be Vietnam Pro", "Helvetica Neue", Arial, sans-serif;
  --ease: .22s cubic-bezier(.4, 0, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--font-body);
  padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
  background-image: radial-gradient(circle at 50% 18%, rgba(250,204,21,.09) 0%, transparent 55%);
}
main { max-width: 30rem; margin: 0 auto; padding-block: 56px 40px; display: grid; justify-items: center; gap: 22px; text-align: center; }
.logo { width: 112px; height: 112px; filter: drop-shadow(0 0 10px rgba(0,0,0,.4)) drop-shadow(0 0 28px rgba(250,204,21,.45)); }
.kicker { letter-spacing: .2em; text-transform: uppercase; font-weight: 600; font-size: .85rem; color: rgba(255,255,255,.8); }
h1 { font-family: var(--font-heading); font-weight: 400; color: var(--sun); text-transform: uppercase; letter-spacing: .05em; font-size: clamp(2.6rem, 10vw, 3.6rem); line-height: .95; margin: -8px 0 0; text-wrap: balance; text-shadow: 0 4px 20px rgba(0,0,0,.5), 0 0 30px rgba(250,204,21,.25); }
.lead { margin: 0; max-width: 34ch; }

form { width: 100%; display: grid; gap: 12px; margin-top: 6px; }
label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
input[type=email] {
  width: 100%; padding: 15px 20px; border-radius: 9999px; border: 1px solid var(--glass-line);
  background: rgba(0,0,0,.28); color: var(--white); font: inherit; font-size: 1.05rem; text-align: center;
  transition: border-color var(--ease);
}
input[type=email]::placeholder { color: var(--muted); }
input[type=email]:focus { outline: none; border-color: var(--sun); }
input[aria-invalid="true"] { border-color: var(--error); }
button.cta {
  background: var(--sun); color: var(--red); border: 0; border-radius: 9999px; padding: 15px 28px;
  font: inherit; font-size: 1.05rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; cursor: pointer;
  transition: transform var(--ease), box-shadow var(--ease), opacity var(--ease);
}
button.cta:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 30px rgba(250,204,21,.4); }
button.cta:disabled { opacity: .6; cursor: wait; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

#msg { min-height: 1.6em; margin: 0; font-weight: 600; }
#msg.error { color: var(--error); }
#msg.ok { color: var(--sun); }
.done { display: grid; gap: 8px; background: var(--glass); border: 1px solid rgba(250,204,21,.35); border-radius: 1rem; padding: 22px; width: 100%; }
.done strong { font-family: var(--font-heading); font-weight: 400; font-size: 1.8rem; letter-spacing: .05em; color: var(--sun); text-transform: uppercase; }
.note { font-size: .82rem; color: var(--muted); margin: 0; max-width: 40ch; }

.langs { display: grid; justify-items: center; gap: 10px; margin-top: 18px; padding-top: 22px; border-top: 1px solid var(--glass-line); width: 100%; }
.langs span { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.flags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.flags button {
  display: inline-flex; align-items: center; gap: 6px; background: transparent; color: var(--text);
  border: 1px solid var(--glass-line); border-radius: 9999px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: .8rem; font-weight: 700; letter-spacing: .06em;
  transition: border-color var(--ease), background var(--ease);
}
.flags button .flag { font-size: 1.15rem; line-height: 1; }
.flags button:hover { border-color: var(--sun); }
.flags button[aria-pressed="true"] { border-color: var(--sun); background: rgba(250,204,21,.12); color: var(--sun); }
footer { color: var(--muted); font-size: .78rem; padding-bottom: 24px; text-align: center; }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="images/logo.png" alt="Sambagasse" onerror="this.hidden=true">
  <div class="kicker" data-t="kicker">Roda de Samba em Zurique</div>
  <h1 data-t="title">A próxima roda no seu e-mail</h1>
  <p class="lead" data-t="lead">Datas das próximas rodas, shows e novidades do Sambagasse direto na sua caixa de entrada.</p>

  <form id="form" novalidate>
    <label class="sr" for="email" data-t="label">Seu e-mail</label>
    <input type="email" id="email" name="email" autocomplete="email" inputmode="email" required placeholder="seu@email.com" data-t-placeholder="placeholder">
    <!-- Campo-armadilha pra robôs: pessoas não veem nem preenchem -->
    <input class="hp" type="text" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="cta" type="submit" id="submit" data-t="button">Quero receber</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>

  <div class="done" id="done" hidden>
    <strong data-t="doneTitle">Pronto!</strong>
    <span data-t="doneText">Você está na lista. Até a próxima roda!</span>
  </div>

  <p class="note" data-t="note">Pra sair da lista é só escrever pra info@sambagasse.ch.</p>

  <nav class="langs" aria-labelledby="langLabel">
    <span id="langLabel" data-t="change">Mudar idioma</span>
    <div class="flags">
      <button type="button" data-lang="pt" aria-pressed="true"><span class="flag" aria-hidden="true">🇧🇷</span>PT</button>
      <button type="button" data-lang="de" aria-pressed="false"><span class="flag" aria-hidden="true">🇩🇪</span>DE</button>
      <button type="button" data-lang="en" aria-pressed="false"><span class="flag" aria-hidden="true">🇬🇧</span>EN</button>
      <button type="button" data-lang="fr" aria-pressed="false"><span class="flag" aria-hidden="true">🇫🇷</span>FR</button>
    </div>
  </nav>
</main>
<footer><a href="https://sambagasse.ch" target="_blank" rel="noopener">sambagasse.ch</a></footer>

<script>
// Supabase: URL do projeto e a chave pública (anon / publishable). Nunca coloque a service_role aqui.
const SUPABASE_URL = "https://fixpfxxlnuhwzvbgcykm.supabase.co";
const SUPABASE_KEY = "sb_publishable_9SUF0gKkr4337Ai9i4kCrg_pSaW2sSI";
const TABLE = "emails_newsletter";

const T = {
  pt: {
    html: "pt-BR", kicker: "Roda de Samba em Zurique", title: "A próxima roda no seu e-mail",
    lead: "Datas das próximas rodas, shows e novidades do Sambagasse direto na sua caixa de entrada.",
    label: "Seu e-mail", placeholder: "seu@email.com", button: "Quero receber", sending: "Enviando…",
    doneTitle: "Pronto!", doneText: "Você está na lista. Até a próxima roda!",
    note: "Pra sair da lista é só escrever pra info@sambagasse.ch.", change: "Mudar idioma",
    invalid: "Esse e-mail parece incompleto. Confere e tenta de novo.",
    already: "Esse e-mail já está na lista. Até a próxima roda!",
    error: "Não deu pra salvar agora. Tenta de novo em instantes.",
  },
  de: {
    html: "de-CH", kicker: "Samba-Roda in Zürich", title: "Die nächste Roda in deinem Postfach",
    lead: "Termine der nächsten Rodas, Konzerte und News von Sambagasse direkt in dein Postfach.",
    label: "Deine E-Mail-Adresse", placeholder: "deine@email.ch", button: "Anmelden", sending: "Wird gesendet…",
    doneTitle: "Geschafft!", doneText: "Du bist auf der Liste. Bis zur nächsten Roda!",
    note: "Abmelden kannst du dich jederzeit mit einer Nachricht an info@sambagasse.ch.", change: "Sprache ändern",
    invalid: "Diese E-Mail-Adresse scheint unvollständig. Bitte prüfe sie nochmal.",
    already: "Diese E-Mail-Adresse ist schon auf der Liste. Bis zur nächsten Roda!",
    error: "Das Speichern hat gerade nicht geklappt. Bitte versuch es gleich nochmal.",
  },
  en: {
    html: "en", kicker: "Samba Roda in Zurich", title: "The next roda in your inbox",
    lead: "Dates of upcoming rodas, concerts and Sambagasse news, straight to your inbox.",
    label: "Your email", placeholder: "you@email.com", button: "Sign me up", sending: "Sending…",
    doneTitle: "You're in!", doneText: "You're on the list. See you at the next roda!",
    note: "To leave the list, just write to info@sambagasse.ch.", change: "Change language",
    invalid: "That email looks incomplete. Please check it and try again.",
    already: "That email is already on the list. See you at the next roda!",
    error: "We couldn't save that right now. Please try again in a moment.",
  },
  fr: {
    html: "fr", kicker: "Roda de samba à Zurich", title: "La prochaine roda dans ta boîte mail",
    lead: "Les dates des prochaines rodas, les concerts et les nouvelles de Sambagasse, directement par e-mail.",
    label: "Ton adresse e-mail", placeholder: "toi@email.ch", button: "Je m'inscris", sending: "Envoi…",
    doneTitle: "C'est fait !", doneText: "Tu es sur la liste. À la prochaine roda !",
    note: "Pour te désinscrire, écris simplement à info@sambagasse.ch.", change: "Changer de langue",
    invalid: "Cette adresse e-mail semble incomplète. Vérifie-la et réessaie.",
    already: "Cette adresse est déjà sur la liste. À la prochaine roda !",
    error: "Impossible d'enregistrer pour l'instant. Réessaie dans un instant.",
  },
};

const $ = (id) => document.getElementById(id);
let lang = "pt";

function setLang(next) {
  lang = T[next] ? next : "pt";
  const t = T[lang];
  document.documentElement.lang = t.html;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll("[data-t-placeholder]").forEach((el) => { el.placeholder = t[el.dataset.tPlaceholder]; });
  document.querySelectorAll(".flags button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  if ($("msg").dataset.key) say($("msg").dataset.key, $("msg").className);
  try { localStorage.setItem("sg-lang", lang); } catch (e) {}
}

function say(key, kind) {
  const msg = $("msg");
  msg.dataset.key = key || "";
  msg.textContent = key ? T[lang][key] : "";
  msg.className = kind || "";
}

function finish(key) {
  $("form").hidden = true;
  $("done").hidden = false;
  if (key === "already") $("done").querySelector("span").textContent = T[lang].already;
}

async function subscribe(e) {
  e.preventDefault();
  const input = $("email");
  const email = input.value.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
    input.setAttribute("aria-invalid", "true");
    say("invalid", "error");
    input.focus();
    return;
  }
  input.removeAttribute("aria-invalid");
  if ($("website").value) { finish(); return; } // robô: finge sucesso e não salva

  const btn = $("submit");
  btn.disabled = true; btn.textContent = T[lang].sending; say("");
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        Prefer: "return=minimal",
      },
      body: JSON.stringify({ email, language: lang }),
    });
    if (res.ok) return finish();
    if (res.status === 409) return finish("already"); // e-mail repetido (índice único)
    console.error("Supabase:", res.status, await res.text());
    say("error", "error");
  } catch (err) {
    console.error("Supabase:", err);
    say("error", "error");
  } finally {
    btn.disabled = false; btn.textContent = T[lang].button;
  }
}

$("form").addEventListener("submit", subscribe);
$("email").addEventListener("input", () => { $("email").removeAttribute("aria-invalid"); if ($("msg").className === "error") say(""); });
document.querySelectorAll(".flags button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));

// Abre sempre em português, a não ser que a pessoa já tenha escolhido outro idioma antes
let saved = null;
try { saved = localStorage.getItem("sg-lang"); } catch (e) {}
setLang(saved || "pt");
</script>
</body>
</html>
